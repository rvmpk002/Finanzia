services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finanzia
      POSTGRES_USER: finanzia
      POSTGRES_PASSWORD: finanzia_dev
    ports:
      - "5432:5432"
    volumes:
      - finanzia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzia -d finanzia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finanzia-postgres-data:
